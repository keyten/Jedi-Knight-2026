// r_rainSplashes test config (docs/rend2-rain-splashes.md)
// exec rain-splashes.cfg on a map loaded with devmap (r_rainSplashDebug is a
// cheat), then use the binds below

r_rainSplashes 1
r_rainSplashSize 6
r_rainSplashLifetime 350
r_rainSplashOpacity 0.5
r_rainSplashDebug 0
r_rainSplashSurfaceResponse 0
r_rainSplashSurfaceDebug 0
r_speeds 0

// weather
bind F5 "r_we heavyrain; r_we constantwind ( 200 0 0 )"
bind F6 "r_we rain"
bind F7 "r_we clear"

// splashes on / off (the rain restarts once when switching)
bind F8 "toggle r_rainSplashes"

// debug: 1 impact points (through walls), 2 crossing test, 3 trajectories, 0 off
bind F9 "toggle r_rainSplashDebug 0 1 2 3"

// chunk boxes (splash slots blue / purple) and GPU timers
bind F10 "toggle r_weatherDebugChunks 0 1"
bind F11 "toggle r_speeds 0 100"

// the weather occlusion map
bind F12 "toggle r_debugWeather 0 1"

// Optional surface response (latched): set to 1, then vid_restart.
// With it enabled, this shows the class map: black hard-dry -> white metal.
// r_rainSplashSurfaceResponse 1
// r_rainSplashSurfaceDebug 1
