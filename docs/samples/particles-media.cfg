// Optional integration with the existing froxel media/particle-lighting path.
// Existing authored media and explicit physicalization policies keep their roles.
set r_volumetricFog 2
set r_volumetricParticles 1
set r_particleLighting 1
set fx_physicalization 2
set fx_physicalizationOptIn "volumetric/black_smoke;volumetric/black_smoke2"
set r_softParticles 1
set r_softParticleDistance 8
set r_particleNearFade 1
set r_particleCulling 1
set r_particleSort 1
set r_transparencySort 1
set r_particleVolume 1
set r_particleSoftScale 0.1
set r_particleBatching 1
set r_particleDepthOnDemand 1
vid_restart
