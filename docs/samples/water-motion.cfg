// Enable visible water geometry, moving banks, wall response and waterfall waves.
// Execute before loading the map, or run vid_restart after changing the latched options.
seta r_gl43 1
seta r_waterSurface 1
seta r_waterWaves 1
seta r_waterGeometry 1
seta r_waterTessellation 1
seta r_waterTessPixels 48
seta r_waterTessLodDistance 192
seta r_waterWaveAmplitude 1.4
seta r_waterShoreline 1
seta r_waterShoreAttenuation 48
seta r_waterInteraction 1
seta r_waterFlow 1
seta r_waterFlowField 1
seta r_waterFlowImpact 1
seta r_waterFoamField 1
seta r_waterWhitewater 1
seta r_waterIntersectionFoam 1
seta r_waterfall 1
seta r_waterfallGeometry 1
seta r_waterfallImpact 1
seta r_waterfallMist 1
