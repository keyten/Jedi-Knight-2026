// r_waterParticles test config (docs/rend2-water-particles.md)
// exec water-particles.cfg on a map loaded with devmap (r_waterParticlesDebug is
// a cheat), dive, then use the binds below

r_waterParticles 1
r_waterParticlesDensity 1
r_waterParticlesSize 1
r_waterParticlesSpeed 1
r_waterParticlesBubbles -1
r_waterParticlesDistance 160
r_waterParticlesProfile 0
r_waterParticlesDebug 0

// on / off
bind F5 "toggle r_waterParticles"

// profile: auto (env.json, else clean), clean, murky, dirty
bind F6 "toggle r_waterParticlesProfile 0 1 2 3"

// density x1 / x4 (clean is meant to be barely there)
bind F7 "toggle r_waterParticlesDensity 1 4"

// share of micro-bubbles: the profile's, none, a third
bind F8 "toggle r_waterParticlesBubbles -1 0 0.33"

// debug: 1 placement (opaque cyan specks, yellow bubbles), 2 no medium in
// front, 3 print the body / counts / CPU time every second, 0 off
bind F9 "toggle r_waterParticlesDebug 0 1 2 3"

// the liquid at the camera as gameplay / the medium see it (tr_liquid.cpp)
bind F10 "r_liquids camera"
bind F11 "toggle r_speeds 0 100"
