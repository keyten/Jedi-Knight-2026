// rend2 skin scattering A/B captures (docs/rend2-skin-sss.md)
//
// Setup (latched, needs vid_restart): r_hdr 1; r_skinSSS 2. Mode 1 is a separate
// run (r_skinSSS 1; vid_restart). exec skinsss_ab.cfg once (debug views need
// cheats: devmap). Stand in front of the subject and press F8: screenshots of
// strength 0 (legacy look with the same build) / 1, the compare split and every
// debug view, then the settings are restored. F7 lists the skin decision of the
// stages drawn so far (r_skinSSSList), F6 toggles the split screen, F5 steps the
// debug views, F4 toggles r_speeds 100 (GPU timers "Skin SSS H / V / composite").
//
// Subjects: npc spawn kyle | jan | luke | reborn | cultist | rodian | jedi_hf
//           (player model), ten reborn at 5-30 m for the distance test.
// Scenes:   face close-up; strong side light; red / blue saber next to the face;
//           outdoor sun; dark room; face against a bright background edge;
//           hair edge (kyle, jedi_hf); several NPCs at distance.
// Optional: copy tools/skinsss/zz_skinsss_test.pk3 into base/ for the masked
//           kyle / jedi_hf test shaders (vid_restart).

set logfile 1

set sss_ab_0 "r_skinSSSDebug 0; r_skinSSSCompare 0; r_skinSSSStrength 0; wait 10; screenshot"
set sss_ab_1 "r_skinSSSStrength 1; wait 10; screenshot"
set sss_ab_c "r_skinSSSCompare 1; wait 10; screenshot; r_skinSSSCompare 0"
set sss_ab_d1 "r_skinSSSDebug 1; wait 10; screenshot"
set sss_ab_d2 "r_skinSSSDebug 2; wait 10; screenshot"
set sss_ab_d3 "r_skinSSSDebug 3; wait 10; screenshot"
set sss_ab_d4 "r_skinSSSDebug 4; wait 10; screenshot"
set sss_ab_d5 "r_skinSSSDebug 5; wait 10; screenshot"
set sss_ab_d6 "r_skinSSSDebug 6; wait 10; screenshot"
set sss_ab_d7 "r_skinSSSDebug 7; wait 10; screenshot"
set sss_ab_d8 "r_skinSSSDebug 8; wait 10; screenshot; r_skinSSSDebug 0"
set sss_ab "vstr sss_ab_0; vstr sss_ab_1; vstr sss_ab_c; vstr sss_ab_d1; vstr sss_ab_d2; vstr sss_ab_d3; vstr sss_ab_d4; vstr sss_ab_d5; vstr sss_ab_d6; vstr sss_ab_d7; vstr sss_ab_d8"

bind F8 "vstr sss_ab"
bind F7 "r_skinSSSList used"
bind F6 "toggle r_skinSSSCompare 0 1"
bind F5 "toggle r_skinSSSDebug 0 1 2 3 4 5 6 7 8"
bind F4 "toggle r_speeds 0 100"
