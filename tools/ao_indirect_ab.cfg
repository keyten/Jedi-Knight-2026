// rend2 GTAO indirect-light integration captures (docs/rend2-ambient-occlusion.md)
//
// Needs r_depthPrepass 1 and r_aoMode 2 at renderer start (autoexec, or
// vid_restart). Contact shadows also need r_contactShadows 1 at start and a map
// sun (r_sunlightMode 1/2, or r_forceSun 1). Cubemaps (r_cubeMapping 1) and
// r_diffuseIBL 1 make the specular occlusion / bent normal differences visible.
// r_debugAO is a cheat: use devmap.
//
//   devmap <map>; exec ao_indirect_ab.cfg
//   npc spawn stormtrooper / npc spawn reborn   (character against a wall, moving NPC)
//
// Scenes: character against a wall, chin / neck (F9 face camera), wall / floor
// seam, rails, shiny metal near a wall, rough cloth in a corner, moving NPC.
//
// F9  face close-up camera  / F10 normal camera
// F8  debug series, same view: raw GTAO, denoised, bent normal, diffuse ambient
//     visibility, specular occlusion, contact shadow, combined sun visibility
// F7  specular occlusion series: legacy application, scalar, Lagarde, cone
// F6  bent normals off / on (two screenshots)
// F5  toggle r_aoApply 0 / 1 (legacy / indirect-only)
// F4  toggle r_aoSpecOcclusion 0 / 2
// F3  timing: r_speeds 100 for 5 s (GPU blocks "AO GTAO main/denoise",
//     "AO composite/contact"), bent normals off then on
//
// Screenshots land in base/screenshots; the console log (logfile 1) keeps the
// r_speeds output.

set logfile 1

set ao_face "cg_thirdPerson 1; cg_thirdPersonRange 32; cg_thirdPersonAngle 180; cg_thirdPersonVertOffset 0"
set ao_normal "cg_thirdPersonRange 80; cg_thirdPersonAngle 0; cg_thirdPersonVertOffset 16"

set ao_reset "r_debugAO 0; r_aoApply -1; r_aoSpecOcclusion -1; r_gtaoBentNormals 1"

set ao_dbg_0 "r_debugAO 2; wait 10; screenshot"
set ao_dbg_1 "r_debugAO 3; wait 10; screenshot"
set ao_dbg_2 "r_debugAO 11; wait 10; screenshot"
set ao_dbg_3 "r_debugAO 9; wait 10; screenshot"
set ao_dbg_4 "r_debugAO 12; wait 10; screenshot"
set ao_dbg_5 "r_debugAO 6; wait 10; screenshot"
set ao_dbg_6 "r_debugAO 8; wait 10; screenshot; r_debugAO 0"
set ao_dbg "vstr ao_dbg_0; vstr ao_dbg_1; vstr ao_dbg_2; vstr ao_dbg_3; vstr ao_dbg_4; vstr ao_dbg_5; vstr ao_dbg_6"

set ao_so_0 "vstr ao_reset; r_aoApply 0; wait 10; screenshot"
set ao_so_1 "r_aoApply 1; r_aoSpecOcclusion 0; wait 10; screenshot"
set ao_so_2 "r_aoSpecOcclusion 1; wait 10; screenshot"
set ao_so_3 "r_aoSpecOcclusion 2; wait 10; screenshot; vstr ao_reset"
set ao_so "vstr ao_so_0; vstr ao_so_1; vstr ao_so_2; vstr ao_so_3"

set ao_bent "vstr ao_reset; r_gtaoBentNormals 0; wait 10; screenshot; r_gtaoBentNormals 1; wait 10; screenshot"

set ao_time "vstr ao_reset; r_gtaoBentNormals 0; r_speeds 100; wait 300; r_gtaoBentNormals 1; wait 300; r_speeds 0"

bind F10 "vstr ao_normal"
bind F9 "vstr ao_face"
bind F8 "vstr ao_dbg"
bind F7 "vstr ao_so"
bind F6 "vstr ao_bent"
bind F5 "toggle r_aoApply 0 1"
bind F4 "toggle r_aoSpecOcclusion 0 2"
bind F3 "vstr ao_time"
