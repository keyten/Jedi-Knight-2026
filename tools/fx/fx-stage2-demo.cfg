// Run on a loaded SP map: exec fx-stage2-demo.cfg
set developer 1
set r_volumetricFog 2
set r_volumetricParticles 1
set fx_physicalization 2
set fx_physicalizationOptIn "test/physicalization_explosion"
set fx_physicalizationComposite 1
set fx_physicalizationAdaptive 1
set fx_physicalizationStrength 8
set fx_freeze 0
wait 3
fxplay test/physicalization_explosion 32
wait 30
set fx_freeze 1
wait 5
r_volparticles
echo "Stage 2: compare fx_physicalizationComposite 0 / 1"
echo "Stage 2: with Composite 1, compare fx_physicalizationAdaptive 0 / 1"
echo "Stage 2: debug view r_volumetricFogDebug 26; normal view 0"
echo "Stage 2: finish with fx_freeze 0, strength 1 and both new flags 0"
