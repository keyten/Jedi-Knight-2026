// Exact coalescing preserves the image: compare GPU upload counts.
set developer 1
set r_volumetricFog 2
set r_volumetricParticles 1
set fx_physicalization 2
set fx_physicalizationOptIn "test/physicalization_cluster"
set fx_physicalizationAggregate 0
set fx_physicalizationStrength 8
set fx_freeze 0
wait 3
fxplay test/physicalization_cluster 32
wait 20
set fx_freeze 1
wait 8
r_volparticles
set fx_physicalizationAggregate 1
wait 8
r_volparticles
echo "Aggregate: four coincident media -> one; original sprites stay"
echo "Aggregate: toggle fx_physicalizationAggregate 0 / 1 and run r_volparticles"
echo "Finish: fx_freeze 0, fx_physicalizationStrength 1, fx_physicalizationAggregate 0"
