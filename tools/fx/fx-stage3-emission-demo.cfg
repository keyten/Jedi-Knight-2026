// Start test-fx-stage3-sp.cmd, load a map, exec this file.
// New profiles must have been enabled at map registration.
set developer 1
set r_volumetricFog 2
set r_volumetricParticles 1
set r_volumetricEmission 1
set fx_physicalization 2
set fx_physicalizationOptIn "env/small_fire"
set fx_physicalizationEmission 1
set fx_physicalizationAggregate 0
set fx_freeze 0
wait 3
fxplay env/small_fire 32
wait 16
set fx_freeze 1
wait 5
r_volparticles
echo "Emission: compare fx_physicalizationEmission 0 / 1"
echo "Emission: r_volumetricFogDebug 33 isolates glow; 0 restores normal view"
echo "Emission: original flame sprites and authored lights stay active"
echo "Finish: fx_freeze 0, r_volumetricFogDebug 0, fx_physicalizationEmission 0"
