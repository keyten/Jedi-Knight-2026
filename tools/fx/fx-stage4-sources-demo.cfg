// Run after loading a map with test-fx-stage4-sp.cmd.
set developer 1
set fx_physicalizationSources 1
set fx_physicalizationDebug 1
set fx_freeze 0
wait 4
echo Two independent bursts at the same position, with delayed and child FX
fxplay test/physicalization_sources_smoke 64
fxplay test/physicalization_sources_smoke 64
wait 100
set fx_freeze 1
wait 4
fxsources
echo Each fresh burst has its own source ID; child FX retain that ID
echo Domain 0 is world, 8 means a child of a physics source
echo Counts describe frontend proxies before GPU culling and budgets
echo This stage tracks ownership; it does not change the visual shape
echo To resume: set fx_freeze 0
