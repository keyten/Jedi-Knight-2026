// Run on a loaded SP map during normal gameplay: exec fx-stage1-demo.cfg
// Stationary synthetic puff: isolates medium visibility from stock motion,
// fade curves and manual overrides. Exercises high-confidence generic smoke.
set developer 1
set r_volumetricFog 2
set r_volumetricParticles 1
set fx_physicalizationOptIn "test/physicalization_smoke"
set fx_physicalization 2
// Exaggerate only automatic density for a clearly visible comparison.
set fx_physicalizationStrength 8
set fx_freeze 0
wait 3
// Close enough for the medium to sit in front of a third-person player model.
fxplay test/physicalization_smoke 32
wait 30
set fx_freeze 1
wait 5
r_volparticles
echo "FX demo: compare fx_physicalization 0 and fx_physicalization 2"
echo "FX demo: r_volumetricFogDebug 26 shows density; 0 restores normal view"
echo "FX demo: finish with fx_freeze 0 and fx_physicalizationStrength 1"
