// rend2 auto PBR A/B captures (docs/rend2-auto-pbr.md)
//
// exec autopbr_ab.cfg once (needs cheats: devmap), stand in front of the
// subject, press F8: screenshots for r_autoPBR 0 / 1 / 2 and the two debug
// views, then the settings are restored. F7 dumps the materials drawn so far
// to the console (and qconsole.log with logfile 1).
//
// Subjects: npc spawn kyle | stormtrooper | protocol | r2d2 | reborn |
//           cultist | rodian | jan ; weapons in first person (give all).
// Scenes:   bright indoor, dark indoor, outdoor sun, a surface in front of a
//           cubemap probe, a lit saber / dynamic light close to the subject.

set logfile 1

set pbr_ab_0 "r_autoPBRDebug 0; r_autoPBR 0; wait 10; screenshot"
set pbr_ab_1 "r_autoPBR 1; wait 10; screenshot"
set pbr_ab_2 "r_autoPBR 2; wait 10; screenshot"
set pbr_ab_d1 "r_autoPBRDebug 1; wait 10; screenshot"
set pbr_ab_d2 "r_autoPBRDebug 2; wait 10; screenshot; r_autoPBRDebug 0"
set pbr_ab "vstr pbr_ab_0; vstr pbr_ab_1; vstr pbr_ab_2; vstr pbr_ab_d1; vstr pbr_ab_d2"

bind F8 "vstr pbr_ab"
bind F7 "pbr_dumpMaterials used"
bind F6 "toggle r_autoPBR 0 1 2"
bind F5 "toggle r_autoPBRDebug 0 1 2"

// r_autoPBRRoughness A/B (set r_autoPBRRoughness 1 + vid_restart first so the maps exist)
set pbr_rough_ab "r_autoPBR 2; r_autoPBRRoughness 0; wait 10; screenshot; r_autoPBRRoughness 1; wait 10; screenshot; r_autoPBRDebug 3; wait 10; screenshot; r_autoPBRDebug 0"
bind F9 "vstr pbr_rough_ab"
