// rend2 foliage character interaction (docs/rend2-foliage-interaction.md)
//
// devmap yavin1b (cheats for the debug bits), exec foliageinteract_ab.cfg,
// cg_thirdPerson 1, walk into surface sprite grass or next to a fern
// (r_autoFoliageList plant lists the FOLIAGE_PLANT models of the map).
//
// F8  screenshots: off, on, colliders, contact heat, interaction only
// F7  toggle r_foliageInteraction      F6  toggle colliders (compare with the body)
// F5  toggle contact heat              F4  toggle freeze colliders (TAA / motion vectors)
// F3  timing: r_speeds 1, 10 s each at r_foliageInteractionMaxInteractors 1 / 4 / 8 / 16, then off
// F2  toggle player only / NPCs        F1  toggle x2 radius and strength (video close-ups)
//
// Checklist (third person): stand in a fern, walk slowly, run, strafe, jump,
// crouch; orbit the camera around the standing player (the plants must NOT
// follow the camera); move the camera while the player stands; cinematic;
// NPCs walking through grass; several NPCs; r_smaa 2 ghosting; sun shadows.

set logfile 1
r_autoFoliage 1
r_foliageWind 1
r_plantWind 1

set fi_ab_0 "r_foliageInteractionDebug 0; r_foliageInteraction 0; wait 10; screenshot"
set fi_ab_1 "r_foliageInteraction 1; wait 10; screenshot"
set fi_ab_2 "r_foliageInteractionDebug 1; wait 10; screenshot"
set fi_ab_3 "r_foliageInteractionDebug 8; wait 10; screenshot"
set fi_ab_4 "r_foliageInteractionDebug 4; wait 10; screenshot; r_foliageInteractionDebug 0"
set fi_ab "vstr fi_ab_0; vstr fi_ab_1; vstr fi_ab_2; vstr fi_ab_3; vstr fi_ab_4"

set fi_time "r_foliageInteraction 1; r_speeds 1; r_foliageInteractionMaxInteractors 1; wait 600; r_foliageInteractionMaxInteractors 4; wait 600; r_foliageInteractionMaxInteractors 8; wait 600; r_foliageInteractionMaxInteractors 16; wait 600; r_foliageInteraction 0; wait 600; r_speeds 0; r_foliageInteraction 1; r_foliageInteractionMaxInteractors 8"

bind F8 "vstr fi_ab"
bind F7 "toggle r_foliageInteraction 0 1"
bind F6 "toggle r_foliageInteractionDebug 0 1"
bind F5 "toggle r_foliageInteractionDebug 0 8"
bind F4 "toggle r_foliageInteractionDebug 0 16"
bind F3 "vstr fi_time"
bind F2 "toggle r_foliageInteractionNPCs 0 1"
bind F1 "toggle r_foliageInteractionDebug 0 3"
