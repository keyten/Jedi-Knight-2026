// rend2 vegetation deformation (docs/rend2-foliage-interaction.md): MD3 plants as
// frond chains (tr_plantsim.cpp), grass sprites as inextensible blades on the bend
// field (tr_foliagefield.cpp)
//
// devmap yavin1b (cheats for the debug bits), exec vegetation_ab.cfg,
// cg_thirdPerson 1, walk into a fern (yavin/plant_b, fern3_b) and into sprite grass.
// r_autoFoliageList plant prints the fern models and their frond skeletons,
// r_plantSimInfo the simulated plants of the map.
//
// F8  screenshots: centerlines, contact sides, segments, grass field overlay
// F7  toggle r_foliageInteraction      F6  toggle frond centerlines + contact sides
// F5  toggle segment colors            F4  toggle grass field overlay + covered square
// F3  CPU cost: r_plantDebug 16 prints the simulation time once per second (10 s)
// F2  toggle r_grassTrample 0 / 0.25   F1  toggle r_grassBendSegments 1 / 4 (flat card / curved strip)
//
// Checklist (third person):
// - fern: walk into the middle of a frond; it must swing aside around its base
//   as one piece (never part around the leg), keep its width and length, and
//   swing back with one small overshoot; stand still inside it; walk through
//   slowly and fast; NPCs; low frame rate (com_maxfps 20) must look the same
// - grass: the blades curve from the root (stiff base, soft tip), only what the
//   legs touch moves (nothing ahead of the body), a faint trampled trail fades
//   over ~6 s; jump over grass (no trail); wind gusts curve the blades too
// - motion: r_smaa 2 / TAA without ghosting on swinging fronds; sun shadows and
//   fog follow the bent shape; mirrors / portals

set logfile 1
r_autoFoliage 1
r_foliageWind 1
r_plantWind 1
r_foliageInteraction 1

set veg_ab_0 "r_plantDebug 1; wait 10; screenshot"
set veg_ab_1 "r_plantDebug 9; wait 10; screenshot"
set veg_ab_2 "r_plantDebug 2; wait 10; screenshot"
set veg_ab_3 "r_plantDebug 0; r_foliageBendFieldDebug 3; wait 10; screenshot; r_foliageBendFieldDebug 0"
set veg_ab "vstr veg_ab_0; vstr veg_ab_1; vstr veg_ab_2; vstr veg_ab_3"

set veg_time "r_plantDebug 16; wait 600; r_plantDebug 0"

bind F8 "vstr veg_ab"
bind F7 "toggle r_foliageInteraction 0 1"
bind F6 "toggle r_plantDebug 0 9"
bind F5 "toggle r_plantDebug 0 2"
bind F4 "toggle r_foliageBendFieldDebug 0 3"
bind F3 "vstr veg_time"
bind F2 "toggle r_grassTrample 0 0.25"
bind F1 "toggle r_grassBendSegments 1 4"
