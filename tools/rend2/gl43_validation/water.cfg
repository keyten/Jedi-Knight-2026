// Copy into the active base/OpenJK directory and launch with +exec water.cfg.
wait 60
r_gl43 1
r_waterSurface 1
r_waterInteraction 1
r_waterIntersectionFoam 1
r_waterIntersectionFoamDebug 1
r_waterWaveTime 4
vid_restart
wait 120
devmap yavin1
wait 180
cam_disable
noclip
god
setviewpos 1024 -3900 210 90
centerview
+lookdown
wait 20
-lookdown
r_waterInteractionInfo
r_waterIntersectionVerify
wait 20
screenshot_tga gl43-water-contact-debug
r_waterInteractionInfo
echo GL43_WATER_CAPTURE_DONE
// Sleeping/wake and 30-second stationary-contact checks require moving the
// player and are intentionally performed interactively after this marker.
