// Copy into the active base/OpenJK directory and launch with +exec forwardplus.cfg.
wait 60
r_gl43 1
r_smaa 0
r_autoExposure 0
r_dynamicGlow 0
r_bloom 0
r_forwardPlus 1
r_forwardPlusCompute 0
r_forwardPlusDebug 0
r_dlightMode 2
vid_restart
wait 120
devmap t2_trip
wait 180
r_forwardPlusSpawnTestLights 128
timescale 0
cg_draw2D 0
r_drawentities 0
r_forwardPlusMaxLightsPerCluster 255

r_forwardPlusCompute 0
wait 20
screenshot_tga gl43-fplus-cpu-beauty
r_forwardPlusCompute 1
wait 20
screenshot_tga gl43-fplus-gpu-beauty

r_forwardPlusDebug 5
vid_restart
wait 120
r_forwardPlusMaxLightsPerCluster 64
r_forwardPlusCompute 0
wait 20
screenshot_tga gl43-fplus-cpu-overflow
r_forwardPlusCompute 1
wait 20
screenshot_tga gl43-fplus-gpu-overflow

r_forwardPlusDebug 4
vid_restart
wait 120
r_forwardPlusCompute 0
wait 20
screenshot_tga gl43-fplus-cpu-heatmap
r_forwardPlusCompute 1
wait 20
screenshot_tga gl43-fplus-gpu-heatmap
r_forwardPlusVerify
wait 10
r_forwardPlusStats
timescale 1
echo GL43_FORWARDPLUS_CAPTURE_DONE
