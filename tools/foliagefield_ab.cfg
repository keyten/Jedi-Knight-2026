// rend2 persistent foliage bend field (docs/rend2-foliage-interaction.md,
// "Persistent bend field")
//
// devmap yavin1b (cheats for the debug bits), exec foliagefield_ab.cfg,
// cg_thirdPerson 1, walk through surface sprite grass or a fern.
//
// F8  screenshots: field off, on, overlay, field only, direct only
// F7  toggle r_foliageBendField            F6  toggle overlay + covered square
// F5  toggle freeze                    F4  r_foliageBendFieldClear
// F3  timing: r_speeds 100 (GPU "Foliage field" block) 10 s, then 10 s field off
//     (other sizes: r_foliageBendFieldSize 64 / 256 + vid_restart, then F3 again)
// F2  toggle field only (no direct push)   F1  toggle x3 field strength (video close-ups)
//
// Checklist: walk straight through grass and stop; turn; walk circles; sprint;
// jump through (no trail from the air); NPC crossing; teleport / noclip far
// away (field clears, no smear); map_restart; cinematic camera (field must not
// move with the camera); mirror / portal (same bend in the reflection);
// r_smaa 2 or TAA (no ghosting on the swinging grass); dense grass.
// Recovery: count frames from leaving until rest in a 60 fps capture, or
// watch the overlay heat fade (r_foliageBendFieldRecoveryTime, default 0.8 s).

set logfile 1
r_autoFoliage 1
r_foliageWind 1
r_plantWind 1
r_foliageInteraction 1
r_foliageBendField 1

set ff_ab_0 "r_foliageBendFieldDebug 0; r_foliageBendField 0; wait 10; screenshot"
set ff_ab_1 "r_foliageBendField 1; wait 10; screenshot"
set ff_ab_2 "r_foliageBendFieldDebug 3; wait 10; screenshot"
set ff_ab_3 "r_foliageBendFieldDebug 16; wait 10; screenshot"
set ff_ab_4 "r_foliageBendFieldDebug 32; wait 10; screenshot; r_foliageBendFieldDebug 0"
set ff_ab "vstr ff_ab_0; vstr ff_ab_1; vstr ff_ab_2; vstr ff_ab_3; vstr ff_ab_4"

// GPU time of the update pass (r_speeds 100 lists the timed blocks)
set ff_time "r_speeds 100; wait 600; r_foliageBendField 0; wait 600; r_foliageBendField 1; r_speeds 0"

bind F8 "vstr ff_ab"
bind F7 "toggle r_foliageBendField 0 1"
bind F6 "toggle r_foliageBendFieldDebug 0 3"
bind F5 "toggle r_foliageBendFieldDebug 0 4"
bind F4 "r_foliageBendFieldClear"
bind F3 "vstr ff_time"
bind F2 "toggle r_foliageBendFieldDebug 0 16"
bind F1 "toggle r_foliageBendFieldDebug 0 8"
